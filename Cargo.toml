[package]
name = "strata-monitor"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "A quiet, native resource monitor for Linux, built with GPUI"

[[bin]]
name = "strata"
path = "src/main.rs"

[dependencies]
gpui = "=0.2.2"
nvml-wrapper = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
debug = 0
